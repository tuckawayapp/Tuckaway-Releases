<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The site moved to https://tuckawayapp.github.io/; this page sends a visitor to the same page there. -->
<title>Tuckaway has moved</title>
<link rel="canonical" href="https://tuckawayapp.github.io/">
<meta http-equiv="refresh" content="0; url=https://tuckawayapp.github.io/">
<meta name="robots" content="noindex">
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; padding: 48px 16px; background: #F7F8FB; color: #1A1F29; }
  @media (prefers-color-scheme: dark) { body { background: #14161B; color: #E7EAF0; } a { color: #8AB4FF; } }
  main { max-width: 560px; margin: 0 auto; }
  a { color: #2563EB; }
</style>
</head>
<body>
<main>
  <h1>Tuckaway has moved</h1>
  <p>This page is now at <a href="https://tuckawayapp.github.io/">https://tuckawayapp.github.io/</a>.</p>
</main>
<script>
  // The path after /Tuckaway-Releases/ is the same page on the new site; anything else goes to the home page.
  (function () {
    var rest = location.pathname.replace(/^\/Tuckaway-Releases\/?/, '');
    location.replace('https://tuckawayapp.github.io/' + rest + location.hash);
  })();
</script>
</body>
</html>
